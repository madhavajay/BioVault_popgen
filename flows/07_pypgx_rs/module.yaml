apiVersion: syftbox.openmined.org/v1alpha1
kind: Module
metadata:
  name: 07_pypgx_rs
  version: 0.2.5
  authors:
    - madhava@openmined.org
  description: |
    PyPGx-rs pharmacogenomics flow. Genotype text files are converted to VCF
    with biosynth when needed, then pypgx-rs runs the NGS pipeline and the flow
    aggregates unique genotype calls by country and gene.
spec:
  runner:
    kind: nextflow
    entrypoint: main.nf
    template: dynamic-nextflow
    image: ghcr.io/madhavajay/pypgx-rs:v0.26.0-rs.1
  inputs:
    - name: participants
      type: List[GenotypeRecord]
      description: >
        CSV/TSV with participant_id, genotype_file, and optional country facet.
        genotype_file may point to genotype text or VCF/VCF.GZ/VCF.BGZ input.
      format:
        kind: csv
        mapping:
          participant_id: participant_id
          genotype_file: genotype_file
  outputs:
    - name: participant_results
      type: File
      description: Per-participant PyPGx-rs gene calls with raw phased variant tokens from consolidated-variants.zip when available.
      format:
        kind: tsv
      path: pypgx_participant_results.tsv
    - name: country_summary
      type: File
      description: Counts grouped by country, gene, genotype, and phenotype.
      format:
        kind: tsv
      path: pypgx_country_summary.tsv
    - name: phase_reclassification_groups_aggregate
      type: File
      description: Reclassification groups aggregated by country, gene, genotype, phenotype, and raw phased variant tokens.
      format:
        kind: csv
      path: phase_reclassification_groups_aggregate.csv
    - name: errors
      type: File
      description: Structured PyPGx flow errors.
      format:
        kind: tsv
      path: errors.tsv
    - name: warnings
      type: File
      description: Structured PyPGx flow warnings.
      format:
        kind: tsv
      path: warnings.tsv
    - name: failures
      type: File
      description: Participants that failed PyPGx (OOM SIGKILL, conversion error, or dropped/killed) with the reason — the pipeline marks them down and continues.
      format:
        kind: tsv
      path: pypgx_failures.tsv
    - name: pipeline_log
      type: File
      description: PyPGx-rs pipeline summary log (expected/succeeded/failed participant counts).
      path: pypgx_pipeline.log
  parameters:
    - name: pypgx_rs_image
      type: String
      description: Optional Docker image override for pypgx-rs.
      required: false
    - name: pypgx_genes
      type: String
      description: Optional comma-separated gene list passed to pypgx-rs --genes.
      required: false
    - name: pypgx_assembly
      type: String
      description: Assembly passed to pypgx-rs --assembly. Default is GRCh38.
      required: false
  assets: []
