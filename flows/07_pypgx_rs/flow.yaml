apiVersion: syftbox.openmined.org/v1alpha1
kind: Flow
metadata:
  name: 07_pypgx_rs
  version: 0.2.6
spec:
  inputs:
    samplesheet:
      type: List[GenotypeRecord]
      description: Genotype samplesheet with participant_id, genotype_file, and optional country facet.
  steps:
    - id: pypgx_rs
      uses: ./
      with:
        participants: inputs.samplesheet
      publish:
        participant_results: File(pypgx_participant_results.tsv)
        country_summary: File(pypgx_country_summary.tsv)
        phase_reclassification_groups_aggregate: File(phase_reclassification_groups_aggregate.csv)
        failures: File(pypgx_failures.tsv)
        errors: File(errors.tsv)
        warnings: File(warnings.tsv)
        pipeline_log: File(pypgx_pipeline.log)
