apiVersion: syftbox.openmined.org/v1alpha1
kind: Flow
metadata:
  name: 08_bv_paper_sex_biased_openadmixture
  version: 0.1.0
spec:
  inputs:
    samplesheet:
      type: List[GenotypeRecord]
      description: Genotype samplesheet with a participant `sex` facet column.
      required_facets:
        - sex
  steps:
    - id: sex_biased_openadmixture
      uses: ./
      with:
        participants: inputs.samplesheet
      publish:
        sex_bias_x_vs_auto: File(sex_bias_x_vs_auto.tsv)
        sex_bias_plot: File(sex_bias_x_vs_auto.png)
        sex_bias_plot_pdf: File(sex_bias_x_vs_auto.pdf)
        sex_bias_per_sample: File(sex_bias_per_sample_K5.tsv)
        figures: File(figure_sex_biased_openadmixture_K5.png)
        figures_pdf: File(figure_sex_biased_openadmixture_K5.pdf)
        component_labels: File(component_labels.tsv)
        qc_report: File(qc_report.txt)
        labeled_q_files: File(openadmixture_*_labeled_Q.tsv)
        openadmixture_q_files: File(openadmixture_*.Q)
        openadmixture_p_files: File(openadmixture_*.P)
        openadmixture_logs: File(openadmixture_*.log)
        plink_bed_archive: File(plink_bed.tar.gz)
