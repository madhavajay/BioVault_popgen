apiVersion: syftbox.openmined.org/v1alpha1
kind: Flow
metadata:
  name: 10_apol1
  version: 0.2.6
spec:
  inputs:
    samplesheet:
      type: List[GenotypeRecord]
      description: Genotype samplesheet with participant_id, genotype_file, and country facet columns.
      required_facets:
        - country
  steps:
    - id: apol1
      uses: ./
      with:
        participants: inputs.samplesheet
      publish:
        participant_reports: Directory(participants)
        country_aggregates: Directory(countries)
        observations: File(observations.tsv)
        reports: File(reports.jsonl)
        analysis: File(analysis.jsonl)
        participant_analysis: File(apol1_participant_analysis.tsv)
        country_analysis_counts: File(apol1_country_analysis_counts.tsv)
        country_variant_counts: File(apol1_country_variant_counts.tsv)
