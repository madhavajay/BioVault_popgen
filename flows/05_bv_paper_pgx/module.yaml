apiVersion: syftbox.openmined.org/v1alpha1
kind: Module
metadata:
  name: 05_bv_paper_pgx
  version: 0.2.1
  authors:
    - madhava@openmined.org
  description: |
    Pharmacogenomics flow. Each selected genotype TXT is converted to a
    compressed VCF with biosynth (`bvs genotype-to-vcf --gzip`), then run
    through the Docker PharmCAT pipeline (`pgkb/pharmcat`). Per-participant
    PharmCAT reports are aggregated into participant-level rows plus
    country+sex and country-only count summaries.
spec:
  runner:
    kind: nextflow
    entrypoint: main.nf
    template: dynamic-nextflow
    image: pgkb/pharmcat
  inputs:
    - name: participants
      type: List[GenotypeRecord]
      description: >
        CSV/TSV with participant_id, genotype_file and country/sex facet
        columns. genotype_file points to a DDNA GSAv3 TXT genotype file.
      required_facets:
        - country
        - sex
      format:
        kind: csv
        mapping:
          participant_id: participant_id
          genotype_file: genotype_file
  outputs:
    - name: participant_results
      type: File
      description: One row per participant PharmCAT gene result, with country and sex facets.
      format:
        kind: tsv
      path: pgx_participant_results.tsv
    - name: country_sex_summary
      type: File
      description: Counts grouped by country, sex, gene, diplotype, and phenotype.
      format:
        kind: tsv
      path: pgx_country_sex_summary.tsv
    - name: country_summary
      type: File
      description: Counts grouped by country, gene, diplotype, and phenotype; sums across sex.
      format:
        kind: tsv
      path: pgx_country_summary.tsv
    - name: participant_manifest
      type: File
      description: Participant-to-facet manifest for successfully completed PharmCAT runs.
      format:
        kind: tsv
      path: pgx_participant_manifest.tsv
    - name: gene_country_burden
      type: File
      description: Non-reference PGx call burden by country and gene.
      format:
        kind: tsv
      path: pgx_gene_country_burden.tsv
    - name: gene_country_sex_burden
      type: File
      description: Non-reference PGx call burden by country, sex, and gene.
      format:
        kind: tsv
      path: pgx_gene_country_sex_burden.tsv
    - name: pgx_plots
      type: File
      description: PGx non-reference call accumulation heatmaps and burden chart.
      glob: pgx_plots/*
      cardinality: many
    - name: converted_vcfs
      type: File
      description: Per-participant compressed VCFs generated by biosynth.
      glob: vcfs/*.vcf.gz
      cardinality: many
    - name: pharmcat_reports
      type: File
      description: Per-participant PharmCAT report TSVs.
      glob: pharmcat_reports/*.report.tsv
      cardinality: many
    - name: pharmcat_json
      type: File
      description: Per-participant PharmCAT report JSONs.
      glob: pharmcat_reports/*.report.json
      cardinality: many
    - name: pharmcat_html
      type: File
      description: Per-participant PharmCAT report HTMLs.
      glob: pharmcat_reports/*.report.html
      cardinality: many
    - name: pipeline_log
      type: File
      description: PGx pipeline summary log.
      path: pgx_pipeline.log
  parameters: []
  assets: []
