apiVersion: syftbox.openmined.org/v1alpha1
kind: Module
metadata:
  name: 05_bv_paper_pgx
  version: 0.2.7
  authors:
    - madhava@openmined.org
  description: |
    Pharmacogenomics flow. Each selected genotype TXT is converted to a
    compressed VCF with biosynth (`bvs genotype-to-vcf --gzip`), while existing
    VCF inputs are passed directly to PharmCAT (`ghcr.io/madhavajay/pharmcat:cyp2d6-enabled`). Per-participant
    PharmCAT reports are aggregated into requested possible-genotype rows and
    country/gene/genotype count summaries, while retaining the richer participant
    and country summary outputs.
spec:
  runner:
    kind: nextflow
    entrypoint: main.nf
    template: dynamic-nextflow
    image: ghcr.io/madhavajay/pharmcat:cyp2d6-enabled
  inputs:
    - name: participants
      type: List[GenotypeRecord]
      description: >
        CSV/TSV with participant_id, genotype_file and country facet columns.
        genotype_file may point to DDNA, Illumina, 23andMe/PGP-style genotype
        text, or VCF/VCF.GZ/VCF.BGZ input.
      required_facets:
        - country
      format:
        kind: csv
        mapping:
          participant_id: participant_id
          genotype_file: genotype_file
  outputs:
    - name: participant_results
      type: File
      description: One row per participant PharmCAT gene result, with the country facet.
      format:
        kind: tsv
      path: pgx_participant_results.tsv
    - name: participant_possible_genotypes
      type: File
      description: Raw participant-level PGx calls with PharmCAT match scores retained in possible_genotypes.
      format:
        kind: tsv
      path: pgx_participant_possible_genotypes.tsv
    - name: participant_possible_genotypes_normalized
      type: File
      description: Participant-level PGx calls with PharmCAT match scores stripped from possible_genotypes for genotype identity grouping.
      format:
        kind: tsv
      path: pgx_participant_possible_genotypes_normalized.tsv
    - name: country_gene_genotype_counts
      type: File
      description: Raw counts grouped by country, gene, and PharmCAT score-bearing possible_genotypes; sample_count is the country/gene denominator and frequency is count/sample_count.
      format:
        kind: tsv
      path: pgx_country_gene_genotype_counts.tsv
    - name: country_gene_genotype_counts_normalized
      type: File
      description: Counts grouped by country, gene, and normalized possible_genotypes with PharmCAT match scores stripped; sample_count is the country/gene denominator and frequency is count/sample_count.
      format:
        kind: tsv
      path: pgx_country_gene_genotype_counts_normalized.tsv
    - name: country_summary
      type: File
      description: Counts grouped by country, gene, diplotype, and phenotype; sample_count is the country/gene denominator and frequency is count/sample_count.
      format:
        kind: tsv
      path: pgx_country_summary.tsv
    - name: failures
      type: File
      description: Participants that failed PharmCAT (OOM/combinatorial blow-up, conversion error, or dropped/killed) with the reason — the pipeline marks them down and continues.
      format:
        kind: tsv
      path: pgx_failures.tsv
    - name: pipeline_log
      type: File
      description: PGx pipeline summary log (expected/succeeded/failed participant counts).
      path: pgx_pipeline.log
  parameters: []
  assets: []
