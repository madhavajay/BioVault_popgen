apiVersion: syftbox.openmined.org/v1alpha1
kind: Module
metadata:
  name: 05_bv_paper_pgx
  version: 0.2.2
  authors:
    - madhava@openmined.org
  description: |
    Pharmacogenomics flow. Each selected genotype TXT is converted to a
    compressed VCF with biosynth (`bvs genotype-to-vcf --gzip`), while existing
    VCF inputs are passed directly to PharmCAT (`pgkb/pharmcat`). Per-participant
    PharmCAT reports are aggregated into requested possible-genotype rows and
    country/gene/genotype count summaries, while retaining the richer participant
    and country summary outputs.
spec:
  runner:
    kind: nextflow
    entrypoint: main.nf
    template: dynamic-nextflow
    image: pgkb/pharmcat
  inputs:
    - name: participants
      type: List[GenotypeRecord]
      description: >
        CSV/TSV with participant_id, genotype_file and country facet columns.
        genotype_file may point to DDNA, Illumina, 23andMe/PGP-style genotype
        text, or VCF/VCF.GZ/VCF.BGZ input.
      required_facets:
        - country
      format:
        kind: csv
        mapping:
          participant_id: participant_id
          genotype_file: genotype_file
  outputs:
    - name: participant_results
      type: File
      description: One row per participant PharmCAT gene result, with the country facet.
      format:
        kind: tsv
      path: pgx_participant_results.tsv
    - name: participant_possible_genotypes
      type: File
      description: Requested participant-level PGx calls with participant_id, country, gene, and possible_genotypes.
      format:
        kind: tsv
      path: pgx_participant_possible_genotypes.tsv
    - name: country_gene_genotype_counts
      type: File
      description: Counts grouped by country, gene, and unresolved possible_genotypes combination.
      format:
        kind: tsv
      path: pgx_country_gene_genotype_counts.tsv
    - name: country_summary
      type: File
      description: Counts grouped by country, gene, diplotype, and phenotype.
      format:
        kind: tsv
      path: pgx_country_summary.tsv
    - name: participant_manifest
      type: File
      description: Participant-to-facet manifest for successfully completed PharmCAT runs.
      format:
        kind: tsv
      path: pgx_participant_manifest.tsv
    - name: gene_country_burden
      type: File
      description: Non-reference PGx call burden by country and gene.
      format:
        kind: tsv
      path: pgx_gene_country_burden.tsv
    - name: pgx_plots
      type: File
      description: PGx non-reference call accumulation country heatmap and burden chart.
      glob: pgx_plots/*
      cardinality: many
    - name: converted_vcfs
      type: File
      description: Per-participant VCFs generated by biosynth or passed through from VCF input.
      glob: vcfs/*.vcf.gz
      cardinality: many
    - name: pharmcat_reports
      type: File
      description: Per-participant PharmCAT report TSVs.
      glob: pharmcat_reports/*.report.tsv
      cardinality: many
    - name: pharmcat_json
      type: File
      description: Per-participant PharmCAT report JSONs.
      glob: pharmcat_reports/*.report.json
      cardinality: many
    - name: pharmcat_html
      type: File
      description: Per-participant PharmCAT report HTMLs.
      glob: pharmcat_reports/*.report.html
      cardinality: many
    - name: pipeline_log
      type: File
      description: PGx pipeline summary log.
      path: pgx_pipeline.log
  parameters: []
  assets: []
