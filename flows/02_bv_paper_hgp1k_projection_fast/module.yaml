apiVersion: syftbox.openmined.org/v1alpha1
kind: Module
metadata:
  name: 02_bv_paper_hgp1k_projection_fast
  version: 0.2.5
  authors:
    - madhava@openmined.org
  description: |
    Joint PCA of BioVault samples and filtered 1000 Genomes high-coverage
    genotypes on shared locus_map.tsv SNPs. Unlike gnomAD projection, this
    computes a PCA from the combined 1KGP + study dosage matrix.
spec:
  runner:
    kind: nextflow
    entrypoint: main.nf
    template: dynamic-nextflow
    image: ghcr.io/madhavajay/biovault-popgen:0.2.5-fast
  inputs:
    - name: participants
      type: List[GenotypeRecord]
      description: CSV/TSV with participant_id and genotype_file columns.
      format:
        kind: csv
        mapping:
          participant_id: participant_id
          genotype_file: genotype_file
  outputs:
    - name: scores
      type: File
      description: PCA scores for 1KGP and BioVault samples.
      format:
        kind: tsv
      path: pca_scores.tsv
    - name: study_projection_tsv
      type: File
      description: Study-only PCA scores in legacy projection TSV shape.
      format:
        kind: tsv
      path: study_pca_projection.tsv
    - name: allele_freqs
      type: File
      description: Per-locus allele frequencies for 1KGP and study samples.
      format:
        kind: tsv
      path: allele_freqs.tsv
    - name: qc_report
      type: File
      description: QC summary.
      path: qc_report.txt
    - name: projection_plot
      type: File
      description: PC1 vs PC2 scatter of 1KGP and BioVault samples.
      path: pca_projection.png
    - name: errors
      type: File
      description: Participant-level parse errors, if any.
      format:
        kind: tsv
      path: errors.tsv
    - name: closest_population_labels
      type: File
      description: Ranked nearest 1KGP population centroids for each study sample.
      format:
        kind: tsv
      path: closest_population_labels.tsv
    - name: closest_population_summary
      type: File
      description: Compact closest 1KGP population labels for each study sample.
      format:
        kind: tsv
      path: closest_population_summary.tsv
    - name: pca_variants_used
      type: File
      description: Exact 1KGP/reference variants used in the PCA after duplicate-position and AF/missingness filters.
      format:
        kind: tsv
      path: pca_variants_used.tsv
    - name: pca_variants_dropped
      type: File
      description: Variants dropped before PCA, including duplicate-position drops and AF/reference-missingness filter reasons.
      format:
        kind: tsv
      path: pca_variants_dropped.tsv
  parameters:
    - name: hgp1k_image
      type: String
      description: Optional Docker image override for testing an unpublished HGP1K image.
      required: false
  assets: []
