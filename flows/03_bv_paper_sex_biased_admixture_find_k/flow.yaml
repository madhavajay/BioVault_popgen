apiVersion: syftbox.openmined.org/v1alpha1
kind: Flow
metadata:
  name: 03_bv_paper_sex_biased_admixture_find_k
  version: 0.2.3
spec:
  inputs:
    samplesheet:
      type: List[GenotypeRecord]
      description: Genotype samplesheet with a self-reported ancestry facet.
  steps:
    - id: sex_biased_admixture_find_k
      uses: ./
      with:
        participants: inputs.samplesheet
      publish:
        cv_errors: File(admixture_cv_errors.tsv)
        k_summary: File(admixture_k_summary.tsv)
        k_summary_plot: File(admixture_k_summary.png)
        selected_k: File(selected_k.tsv)
        component_anchor_means: File(component_anchor_means.tsv)
        component_labels: File(component_labels.tsv)
        ancestry_anchor_samples: File(ancestry_anchor_samples.tsv)
        reported_ancestry_normalized: File(reported_ancestry_normalized.tsv)
        find_k_report: File(find_k_report.txt)
        plink_bed: Directory(plink_bed)
        plink_files: File(plink_bed/genotypes.*)
        plink_bed_archive: File(plink_bed.tar.gz)
        admixture_q_files: File(admixture_K*.Q)
        admixture_p_files: File(admixture_K*.P)
        admixture_labeled_q_files: File(admixture_K*_labeled_Q.tsv)
        admixture_log_files: File(admixture_K*.log)
        admixture_raw: Directory(admixture_raw)
        admixture_raw_archive: File(admixture_raw.tar.gz)
        admixture_logs: Directory(admixture_logs)
        admixture_logs_archive: File(admixture_logs.tar.gz)
