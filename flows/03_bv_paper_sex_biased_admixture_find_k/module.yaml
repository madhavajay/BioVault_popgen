apiVersion: syftbox.openmined.org/v1alpha1
kind: Module
metadata:
  name: 03_bv_paper_sex_biased_admixture_find_k
  version: 0.2.3
  authors:
    - madhava@openmined.org
  description: |
    ADMIXTURE K-search for the reported-ancestry sex-biased admixture workflow.
    The module uses single-ancestry self-reported participants as anchors to
    label anonymous ADMIXTURE components.
spec:
  runner:
    kind: nextflow
    entrypoint: main.nf
    template: dynamic-nextflow
    image: ghcr.io/madhavajay/biovault-popgen:0.2.3-fast
  inputs:
    - name: participants
      type: List[GenotypeRecord]
      description: >
        CSV/TSV with participant_id, genotype_file, and a self-reported ancestry
        facet or column. Accepted column/facet names include ancestry,
        self_reported_ancestry, reported_ancestry, and ethnicity.
      format:
        kind: csv
        mapping:
          participant_id: participant_id
          genotype_file: genotype_file
  outputs:
    - name: cv_errors
      type: File
      description: ADMIXTURE cross-validation error per K.
      format:
        kind: tsv
      path: admixture_cv_errors.tsv
    - name: k_summary
      type: File
      description: ADMIXTURE mean CV error and runtime summary per K.
      format:
        kind: tsv
      path: admixture_k_summary.tsv
    - name: k_summary_plot
      type: File
      description: Plot of CV error and runtime by K.
      path: admixture_k_summary.png
    - name: selected_k
      type: File
      description: Selected K, currently the minimum-CV-error K.
      format:
        kind: tsv
      path: selected_k.tsv
    - name: component_anchor_means
      type: File
      description: Mean Q component values by single-ancestry anchor group.
      format:
        kind: tsv
      path: component_anchor_means.tsv
    - name: component_labels
      type: File
      description: Component-to-ancestry label map inferred from anchor groups.
      format:
        kind: tsv
      path: component_labels.tsv
    - name: ancestry_anchor_samples
      type: File
      description: Participants whose self-reported ancestry was single-label and usable as anchors.
      format:
        kind: tsv
      path: ancestry_anchor_samples.tsv
    - name: reported_ancestry_normalized
      type: File
      description: Normalized reported ancestry labels for all retained participants.
      format:
        kind: tsv
      path: reported_ancestry_normalized.tsv
    - name: find_k_report
      type: File
      description: Text report summarizing the K-search run.
      path: find_k_report.txt
    - name: plink_bed
      type: Directory
      description: PLINK BED/BIM/FAM files generated by biosynth for the cohort.
      path: plink_bed
    - name: plink_files
      type: File
      description: PLINK BED/BIM/FAM files generated by biosynth for the cohort.
      path: plink_bed/genotypes.*
    - name: plink_bed_archive
      type: File
      description: Downloadable archive of the generated PLINK BED/BIM/FAM files.
      path: plink_bed.tar.gz
    - name: admixture_q_files
      type: File
      description: ADMIXTURE Q matrices for every K/replicate.
      path: admixture_K*.Q
    - name: admixture_p_files
      type: File
      description: ADMIXTURE P matrices for every K/replicate.
      path: admixture_K*.P
    - name: admixture_labeled_q_files
      type: File
      description: ADMIXTURE Q matrices with inferred ancestry labels for every K/replicate.
      path: admixture_K*_labeled_Q.tsv
    - name: admixture_log_files
      type: File
      description: ADMIXTURE logs for every K/replicate.
      path: admixture_K*.log
    - name: admixture_raw
      type: Directory
      description: Raw ADMIXTURE Q/P files plus labeled Q tables for every K/replicate.
      path: admixture_raw
    - name: admixture_raw_archive
      type: File
      description: Downloadable archive of raw ADMIXTURE Q/P files plus labeled Q tables.
      path: admixture_raw.tar.gz
    - name: admixture_logs
      type: Directory
      description: ADMIXTURE stdout/stderr logs for every K/replicate.
      path: admixture_logs
    - name: admixture_logs_archive
      type: File
      description: Downloadable archive of ADMIXTURE stdout/stderr logs.
      path: admixture_logs.tar.gz
  parameters:
    - name: find_k_image
      type: String
      description: Optional Docker image override for testing an unpublished amd64 ADMIXTURE image.
      required: false
  assets: []
