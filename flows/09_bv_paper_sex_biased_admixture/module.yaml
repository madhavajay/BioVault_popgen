apiVersion: syftbox.openmined.org/v1alpha1
kind: Module
metadata:
  name: 09_bv_paper_sex_biased_admixture
  version: 0.2.7
  authors:
    - madhava@openmined.org
  description: |
    HGP1K-anchored sex-biased ADMIXTURE. Runs joint ADMIXTURE of the
    study cohort plus a frozen 1000 Genomes reference (300 each from AFR, AMR,
    EAS, EUR, and SAS, baked as PLINK BED) at K=5 only. It runs once on
    the combined genome, then separately on autosomes and X. Anonymous
    ADMIXTURE components are labelled by which reference superpopulation
    loads highest, which makes the autosome and X runs directly comparable; a
    component over-represented on X (vs autosomes) is the sex-biased admixture
    signal.

    This uses the closed-source ADMIXTURE 1.4 binary and calls X-bearing runs
    with --haploid=male:23. The BioVault image includes the HGP1K reference,
    ADMIXTURE, and PLINK tools. The `sex` facet is materialized into
    sex_mapping.tsv and applied via plink2 --update-sex; sex is never inferred.
    X-only sample missingness uses BV_X_MIND, defaulting to 0.999, so male
    haploid X samples are not removed by the global autosomal BV_MIND threshold
    before ADMIXTURE can use them.
spec:
  runner:
    kind: nextflow
    entrypoint: main.nf
    template: dynamic-nextflow
    image: ghcr.io/madhavajay/biovault-admixture:0.2.5-fast
  inputs:
    - name: participants
      type: List[GenotypeRecord]
      description: >
        CSV/TSV with participant_id, genotype_file and a sex facet column.
        genotype_file points to a DDNA/GSAv3 TXT genotype file.
      required_facets:
        - sex
      format:
        kind: csv
        mapping:
          participant_id: participant_id
          genotype_file: genotype_file
  outputs:
    - name: sex_bias_x_vs_auto
      type: File
      description: K=5, per-ancestry mean study proportion on autosomes vs X with per-sex X breakdown.
      format:
        kind: tsv
      path: sex_bias_x_vs_auto.tsv
    - name: sex_bias_plot
      type: File
      description: Bar chart of mean study ancestry on autosomes vs X (PNG).
      path: sex_bias_x_vs_auto.png
    - name: sex_bias_plot_pdf
      type: File
      description: Cohort autosomes-vs-X bar chart (PDF).
      path: sex_bias_x_vs_auto.pdf
    - name: sex_bias_per_sample
      type: File
      description: Per-individual autosomal vs X proportion (+ delta) per labelled ancestry.
      format:
        kind: tsv
      path: sex_bias_per_sample_K5.tsv
    - name: figures
      type: File
      description: 4-panel sex-biased ADMIXTURE figure (PNG).
      path: figure_sex_biased_admixture_K5.png
    - name: figures_pdf
      type: File
      description: 4-panel sex-biased ADMIXTURE figure (PDF).
      path: figure_sex_biased_admixture_K5.pdf
    - name: component_labels
      type: File
      description: ADMIXTURE component -> ancestry label map, per run (combined/auto/x).
      format:
        kind: tsv
      path: component_labels.tsv
    - name: qc_report
      type: File
      description: Variant/sample counts per compartment, common SNPs, pruned counts, QC params.
      path: qc_report.txt
    - name: labeled_q_files
      type: File
      description: Per-run ancestry-labelled Q tables (sample_id, proportions, group, superpopulation, sex).
      path: admixture_*_labeled_Q.tsv
    - name: admixture_q_files
      type: File
      description: Raw ADMIXTURE Q matrices for every run.
      path: admixture_*.Q
    - name: admixture_p_files
      type: File
      description: Raw ADMIXTURE P matrices for every run.
      path: admixture_*.P
    - name: admixture_logs
      type: File
      description: ADMIXTURE logs for every run.
      path: admixture_*.log
  parameters:
    - name: admixture_image
      type: String
      description: Optional Docker image override for the ADMIXTURE/analysis stage.
      required: false
    - name: hgp1k_admixture_ref
      type: String
      description: Optional in-container path override for the HGP1K PLINK reference directory.
      required: false
  assets: []
