apiVersion: syftbox.openmined.org/v1alpha1
kind: Module
metadata:
  name: 04_bv_paper_population_level
  version: 0.1.0
  authors:
    - madhava@openmined.org
  description: |
    Population-level FST + AIMs, driven by a `country` participant facet.

    The cohort is split per country via biosynth (`bvs emit-long` +
    `bvs aggregate-long`) into allele_freq_<country>.tsv, where <country> is
    the facet value normalized to lowercase/underscores. Those per-country
    allele frequencies feed the FST pipeline (pairwise Weir & Cockerham 1984,
    heatmap/dendrogram/PCA) and then the AIMs pipeline (merge against the
    bundled gnomAD HGDP+TGP reference, per-population differential SNPs vs
    gnomAD AFR/global, and AFR/NFE + AFR/SAS AIMs panels with a combined PCA).

    Two containers, orchestrated by Nextflow: biosynth for the split,
    biovault-popgen for FST+AIMs. Fails loudly if any country yields no usable
    genotypes.
spec:
  runner:
    kind: nextflow
    entrypoint: main.nf
    template: dynamic-nextflow
    image: biovault-popgen:0.1.1-fast
  inputs:
    - name: participants
      type: List[GenotypeRecord]
      description: >
        CSV/TSV with participant_id, genotype_file and a country facet column.
        genotype_file points to a DDNA GSAv3 TXT genotype file.
      required_facets:
        - country
      format:
        kind: csv
        mapping:
          participant_id: participant_id
          genotype_file: genotype_file
  outputs:
    - name: country_map
      type: File
      description: participant_id -> normalized country label.
      format:
        kind: tsv
      path: country_map.tsv
    - name: fst_matrix
      type: File
      description: Pairwise WC84 FST matrix (population x population).
      format:
        kind: tsv
      path: fst_matrix.tsv
    - name: merged_allele_freq
      type: File
      description: Per-locus allele frequencies, all populations, rsid-annotated.
      format:
        kind: tsv
      path: merged_allele_freq_annotated.tsv
    - name: master_af_table
      type: File
      description: Populations + gnomAD global/AFR/NFE/SAS allele freq per locus.
      format:
        kind: tsv
      path: master_af_table.tsv
    - name: differential_snps
      type: File
      description: Long-format per-population enriched/depleted SNPs vs gnomAD.
      format:
        kind: tsv
      path: all_outliers_long.tsv
    - name: aims_combined
      type: File
      description: Combined AFR/NFE + AFR/SAS AIMs panel (deduplicated).
      format:
        kind: tsv
      path: aims_combined.tsv
    - name: summary
      type: File
      description: FST matrix + master AF table summary, plus population list.
      path: population_level_summary.txt
  parameters: []
  assets: []
