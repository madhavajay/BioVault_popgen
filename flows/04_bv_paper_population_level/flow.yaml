apiVersion: syftbox.openmined.org/v1alpha1
kind: Flow
metadata:
  name: 04_bv_paper_population_level
  version: 0.2.4
spec:
  inputs:
    samplesheet:
      type: List[GenotypeRecord]
      description: Genotype samplesheet with participant country facet columns.
      required_facets:
        - country
  steps:
    - id: population_level
      uses: ./
      with:
        participants: inputs.samplesheet
      publish:
        allele_freqs: File(allele_freq_*.tsv)
        fst_matrix: File(fst_matrix.tsv)
        merged_allele_freq: File(merged_allele_freq_annotated.tsv)
        master_af_table: File(master_af_table.tsv)
        differential_snps: File(all_outliers_long.tsv)
        aims_combined: File(aims_combined.tsv)
        summary: File(population_level_summary.txt)
