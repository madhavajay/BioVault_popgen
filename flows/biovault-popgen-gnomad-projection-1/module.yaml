apiVersion: syftbox.openmined.org/v1alpha1
kind: Module
metadata:
  name: biovault-popgen-gnomad-projection-1
  version: 0.1.0
  authors:
    - madhava@openmined.org
  description: Project per-participant genotypes onto gnomAD HGDP+1kGP PCA space using v3.1 loadings baked into the BioVault popgen image.
spec:
  runner:
    kind: nextflow
    entrypoint: main.nf
    template: dynamic-nextflow
    image: biovault-popgen:0.1.0
  inputs:
    - name: participants
      type: List[GenotypeRecord]
      description: CSV/TSV with participant_id and genotype_file columns. genotype_file points to a DDNA GSAv3 TXT genotype file.
      format:
        kind: csv
        mapping:
          participant_id: participant_id
          genotype_file: genotype_file
  outputs:
    - name: projection_tsv
      type: File
      description: Study samples projected onto gnomAD HGDP+1kGP PC space (10 PCs).
      format:
        kind: tsv
      path: study_pca_projection.tsv
    - name: qc_report
      type: File
      description: QC summary (input/output SNP and sample counts).
      path: qc_report.txt
    - name: projection_plot
      type: File
      description: PC1 vs PC2 scatter of the projected study samples.
      path: pca_projection.png
  parameters: []
  assets: []
