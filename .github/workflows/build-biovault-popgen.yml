name: build-biovault-popgen

# Builds the biovault-popgen image and publishes it to GHCR on merge to
# main (or manual dispatch). Tags:
#   full amd64 image: <version>, latest, sha-<short>
#   fast multi-arch image: <version>-fast, fast, sha-<short>-fast
#
# IMPORTANT — reference data is NOT regenerated in CI.
# build_docker.sh can mirror the gnomAD HT and derive the AIMs AF table
# from ~260 GB of HGDP+TGP VCFs. That is infeasible on a hosted runner.
# This workflow restores the small pre-derived reference cache
# (.docker/reference/{pca_loadings,aims} ≈ 80 MB) from actions/cache and
# FAILS FAST if it is absent — it never attempts the gsutil/Hail/VCF path.
#
# Priming the cache (one-time, by a maintainer):
#   1. Locally run `bash build_docker.sh` so .docker/reference/ is populated
#      (gnomad.v3.1.pca_loadings.ht, loadings_variants.tsv, loadings.npz,
#       aims/gnomad_af_per_locus.tsv).
#   2. Push that cache via the `prime-reference-cache` manual dispatch
#      (uploads it under the cache key below), or attach it as a release
#      asset and adjust the restore step. Tune to taste — this is a first
#      cut; the owner/tags/cache strategy are expected to be iterated.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - environment.yml
      - environment.fast.yml
      - build_docker.sh
      - "tools/locus_map.tsv"
      - "data/hgp1k_dosage_split/**"
      - ".docker/reference/pca_loadings/**"
      - ".docker/reference/aims/**"
      - "03_individual_level/**/scripts/**"
      - "04_population_level/fst_aims_fast/scripts/**"
      - .github/workflows/build-biovault-popgen.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (defaults to build_docker.sh VERSION)"
        required: false
        default: ""

concurrency:
  group: build-biovault-popgen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Resolves to the org/user that owns the repo running this action.
  # Adjust here once you see the published path you want.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/biovault-popgen
  REF_CACHE_KEY: biovault-popgen-refs-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          # The runtime image is ~6.5 GB + a heavy conda build; hosted
          # runners only ship ~14 GB free. Reclaim the obvious bloat.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Restore reference cache (.docker/reference)
        id: refcache
        uses: actions/cache@v4
        with:
          path: .docker/reference
          key: ${{ env.REF_CACHE_KEY }}
          # Restore-only: this workflow never regenerates the cache, so a
          # partial/older key is useless — require an exact hit.
          lookup-only: false

      - name: Set up Python for HGP1K sidecars
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HGP1K sidecar writer dependencies
        run: python -m pip install numpy

      - name: Reconstruct public HGP1K matrix from split archive
        run: |
          set -euo pipefail
          matrix_dir=".docker/reference/hgp1k/matrix"
          matrix_npz="${matrix_dir}/hgp1k_dosage.npz"
          split_dir="data/hgp1k_dosage_split"
          mkdir -p "${matrix_dir}" .docker/reference/hgp1k

          if [ ! -s "${matrix_npz}" ]; then
            for f in \
              "${split_dir}/hgp1k_dosage.npz.tar.gz.aa" \
              "${split_dir}/hgp1k_dosage.npz.tar.gz.ab" \
              "${split_dir}/hgp1k_dosage.npz.tar.gz.ac" ; do
              if [ ! -s "$f" ]; then
                echo "::error::missing HGP1K split archive shard: $f"
                exit 1
              fi
            done
            tmpdir="$(mktemp -d)"
            cat "${split_dir}"/hgp1k_dosage.npz.tar.gz.* > "${tmpdir}/hgp1k_dosage.npz.tar.gz"
            tar -xzf "${tmpdir}/hgp1k_dosage.npz.tar.gz" -C "${tmpdir}"
            mv "${tmpdir}/hgp1k_dosage.npz" "${matrix_npz}"
            rm -rf "${tmpdir}"
          fi

          metadata=".docker/reference/hgp1k/20130606_g1k_3202_samples_ped_population.txt"
          if [ ! -s "${metadata}" ] && [ -s "data/1kgp_high_coverage/20130606_g1k_3202_samples_ped_population.txt" ]; then
            cp "data/1kgp_high_coverage/20130606_g1k_3202_samples_ped_population.txt" "${metadata}"
          fi

          if [ ! -s "${matrix_dir}/samples.tsv" ] || [ ! -s "${matrix_dir}/variants.tsv" ]; then
            python scripts/write_hgp1k_sidecars.py "${matrix_npz}" "${matrix_dir}"
          fi

          ls -lh "${matrix_npz}"

      - name: Verify reference cache is present (fail fast otherwise)
        run: |
          set -euo pipefail
          missing=0
          for f in \
            .docker/reference/pca_loadings/gnomad.v3.1.pca_loadings.ht.tar.gz \
            .docker/reference/pca_loadings/loadings_variants.tsv \
            .docker/reference/pca_loadings/loadings.npz \
            .docker/reference/aims/gnomad_af_per_locus.tsv \
            .docker/reference/hgp1k/matrix/hgp1k_dosage.npz \
            .docker/reference/hgp1k/matrix/samples.tsv \
            .docker/reference/hgp1k/matrix/variants.tsv \
            .docker/reference/hgp1k/20130606_g1k_3202_samples_ped_population.txt ; do
            if [ ! -s "$f" ] && [ ! -e "$f" ]; then
              echo "::error::missing reference cache file: $f"
              missing=1
            fi
          done
          if [ -e .docker/reference/hgp1k/matrix_pgp ]; then
            echo "::error::PGP/private HGP1K matrix cache is present in CI workspace"
            echo "::error::Refusing public build; remove .docker/reference/hgp1k/matrix_pgp from the cache"
            missing=1
          fi
          if [ -e .docker/reference/pca_locus_map/locus_map.tsv ] && ! cmp -s tools/locus_map.tsv .docker/reference/pca_locus_map/locus_map.tsv; then
            echo "::error::Cached PCA locus map differs from production tools/locus_map.tsv"
            echo "::error::Refusing public build with a local/custom PCA locus map"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Reference cache absent. CI will NOT regenerate it"
            echo "::error::(needs gsutil + Hail + ~260 GB VCFs). Prime the"
            echo "::error::actions cache key '${REF_CACHE_KEY}' first — see"
            echo "::error::the header comment in this workflow."
            exit 1
          fi
          du -sh .docker/reference/* || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: ver
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then
            v="$(sed -nE 's/^VERSION="\$\{VERSION:-([^}]+)\}".*/\1/p' build_docker.sh | head -1)"
          fi
          [ -n "$v" ] || v="0.0.0"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(echo "${{ github.sha }}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build image (build_docker.sh, cache-only refs)
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_FAST: "0"
          BUILD_FAST_PGP: "0"
          TAG_PGP_AS_FAST: "0"
          PCA_LOCUS_MAP_SOURCE: ${{ github.workspace }}/tools/locus_map.tsv
          HGP1K_DEFAULT_MATRIX_SOURCE: ${{ github.workspace }}/.docker/reference/hgp1k/matrix/hgp1k_dosage.npz
          HGP1K_METADATA_SOURCE: ${{ github.workspace }}/.docker/reference/hgp1k/20130606_g1k_3202_samples_ped_population.txt
          # Belt & braces: this stays 0 so build_docker.sh's cache-skip
          # logic never triggers the gsutil/Hail/VCF derivations.
          FORCE_REFERENCE_CACHE: "0"
        run: bash build_docker.sh

      - name: Tag + push full amd64 image
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          S="${{ steps.ver.outputs.sha }}"
          docker tag "${IMAGE_NAME}:${V}" "${IMAGE_NAME}:${S}"
          docker push "${IMAGE_NAME}:${V}"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${S}"
          echo "Published:"
          echo "  ${IMAGE_NAME}:${V}"
          echo "  ${IMAGE_NAME}:latest"
          echo "  ${IMAGE_NAME}:${S}"

      - name: Build + push fast multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: fast-runtime
          build-args: |
            HGP1K_REFERENCE_SUBDIR=matrix
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-fast
            ${{ env.IMAGE_NAME }}:fast
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.sha }}-fast
