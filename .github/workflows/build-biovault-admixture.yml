name: build-biovault-admixture

# Builds the biovault-admixture image (plink/plink2/admixture + the baked
# HGP1K ADMIXTURE reference BED) and publishes it to GHCR on merge to main
# (or manual dispatch). Tags: <version>, <version>-amd64, latest, latest-amd64,
# sha-<short>-amd64.
#
# Reference data is NOT regenerated in CI. Instead the committed split archive
# in data/hgp1k_all_sex_bias/ is reassembled by build_admixture_docker.sh and
# baked into the image. The PGP-filtered package is test data and is not used
# by CI.

on:
  push:
    branches: [main]
    paths:
      - docker/admixture/Dockerfile
      - build_admixture_docker.sh
      - "data/hgp1k_all_sex_bias/**"
      - "03_individual_level/sex_biased_admixture_hgp1k/scripts/**"
      - "03_individual_level/sex_biased_admixture_find_k/scripts/**"
      - "flows/03_bv_paper_sex_biased_admixture_hgp1k/reference/reassemble_reference.sh"
      - .github/workflows/build-biovault-admixture.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (defaults to build_admixture_docker.sh VERSION)"
        required: false
        default: ""

concurrency:
  group: build-biovault-admixture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/biovault-admixture

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Verify real all-sample HGP1K ADMIXTURE reference shards
        run: |
          set -euo pipefail
          shopt -s nullglob
          shards=(data/hgp1k_all_sex_bias/hgp1k_all_sex_bias.tar.gz.*)
          if [ "${#shards[@]}" -eq 0 ]; then
            echo "::error::no real all-sample HGP1K reference shards in data/hgp1k_all_sex_bias/"
            exit 1
          fi
          test -s data/hgp1k_all_sex_bias/hgp1k_all_sex_bias.yaml
          test -s data/hgp1k_all_sex_bias/reference_samples.tsv
          if compgen -G "data/hgp1k_*_sex_bias_pgp/*" >/dev/null; then
            echo "::error::PGP test reference files must not be committed or used by this CI workflow"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then
            v="$(sed -nE 's/^VERSION="\$\{VERSION:-([^}]+)\}".*/\1/p' build_admixture_docker.sh | head -1)"
          fi
          [ -n "$v" ] || v="0.2.6-fast"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(echo "${{ github.sha }}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build + push admixture image with real reference
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.ver.outputs.version }}
          PACKAGE_NAME: hgp1k_all_sex_bias
          FLAVOR: ddnaall
          PLATFORM: linux/amd64
          PUSH: "1"
        run: bash build_admixture_docker.sh

      - name: Tag + push sha image
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          S="${{ steps.ver.outputs.sha }}"
          docker tag "${IMAGE_NAME}:${V}-amd64" "${IMAGE_NAME}:${S}-amd64"
          docker push "${IMAGE_NAME}:${S}-amd64"
          echo "Published:"
          echo "  ${IMAGE_NAME}:${V}-amd64"
          echo "  ${IMAGE_NAME}:${V}"
          echo "  ${IMAGE_NAME}:latest-amd64"
          echo "  ${IMAGE_NAME}:latest"
          echo "  ${IMAGE_NAME}:${S}-amd64"
